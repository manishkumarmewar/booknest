<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookNest — Admin Panel</title>
<!-- Bootstrap: admin panel ka ready-made design -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- ============ ADMIN LOGIN ============ -->
<div id="adminLogin" class="d-none">
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow p-4" style="width:100%;max-width:380px">
      <h3 class="text-center mb-1">🔐 Admin Panel</h3>
      <p class="text-muted text-center small">Sirf dukandaar ke liye</p>
      <div class="mb-3">
        <label class="form-label">Admin Password</label>
        <input id="adminPass" type="password" class="form-control" placeholder="Password daalo">
      </div>
      <p class="text-danger small" id="adminError"></p>
      <button class="btn btn-dark w-100" onclick="adminLogin()">Login</button>
      <!-- Pehli baar: server.js me ADMIN_PASSWORD dekho (default: admin123) -->
    </div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard" class="d-none">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">🔐 BookNest Admin</span>
      <button class="btn btn-sm btn-outline-light" onclick="adminLogout()">Logout</button>
    </div>
  </nav>
  <div class="container py-4">
    <!-- Upar wale 3 hisaab -->
    <div class="row g-3 mb-4">
      <div class="col-md-4"><div class="card text-center p-3"><h2 id="statCustomers">0</h2><span class="text-muted">Total Customers</span></div></div>
      <div class="col-md-4"><div class="card text-center p-3"><h2 id="statOrders">0</h2><span class="text-muted">Total Orders</span></div></div>
      <div class="col-md-4"><div class="card text-center p-3"><h2 id="statRevenue">₹0</h2><span class="text-muted">Total Revenue</span></div></div>
    </div>

    <h4>👥 Customers</h4>
    <div class="table-responsive mb-4">
      <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark"><tr><th>Username</th><th>Email</th><th>Phone</th><th>Signup Date</th><th>Orders</th></tr></thead>
        <tbody id="customerRows"><tr><td colspan="5" class="text-muted">Loading…</td></tr></tbody>
      </table>
    </div>

    <h4>📦 Orders</h4>
    <div class="table-responsive">
      <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark"><tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Delivery Address</th><th>Payment</th></tr></thead>
        <tbody id="orderRows"><tr><td colspan="7" class="text-muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ---------- ADMIN LOGIN ----------
async function adminLogin() {
  const password = document.getElementById('adminPass').value;
  const err = document.getElementById('adminError');
  err.textContent = '';
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  const data = await res.json();
  if (!res.ok) { err.textContent = data.error || 'Login failed'; return; }
  showDashboard();
}

async function adminLogout() {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.reload();
}

// ---------- DASHBOARD BHARNA ----------
function showDashboard() {
  document.getElementById('adminLogin').classList.add('d-none');
  document.getElementById('dashboard').classList.remove('d-none');
  loadData();
}

async function loadData() {
  // Customers lao
  const cRes = await fetch('/api/admin/customers');
  if (!cRes.ok) return showLogin(); // login nahi hai to login page
  const customers = await cRes.json();

  // Orders lao
  const oRes = await fetch('/api/admin/orders');
  const orders = await oRes.json();

  // Upar ke 3 hisaab
  document.getElementById('statCustomers').textContent = customers.length;
  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statRevenue').textContent = '₹' + orders.reduce((s, o) => s + o.total, 0);

  // Customers table
  document.getElementById('customerRows').innerHTML = customers.length ? customers.map(c => `
    <tr>
      <td><b>${c.username}</b></td>
      <td>${c.email}</td>
      <td>${c.phone}</td>
      <td>${new Date(c.createdAt).toLocaleString('en-IN')}</td>
      <td>${c.orders}</td>
    </tr>`).join('')
    : '<tr><td colspan="5" class="text-muted">Abhi koi customer nahi hai.</td></tr>';

  // Orders table
  document.getElementById('orderRows').innerHTML = orders.length ? orders.map(o => `
    <tr>
      <td><b>${o.id}</b></td>
      <td>${new Date(o.placedAt).toLocaleString('en-IN')}</td>
      <td>${o.customer}<br><small class="text-muted">${o.phone}</small></td>
      <td>${o.items.map(i => `${i.title} × ${i.qty}`).join('<br>')}</td>
      <td><b>₹${o.total}</b></td>
      <td>${o.name}<br><small class="text-muted">${o.address}, ${o.city} — ${o.pincode}</small></td>
      <td>${o.payment}<br><span class="badge bg-success">${o.status}</span></td>
    </tr>`).join('')
    : '<tr><td colspan="7" class="text-muted">Abhi koi order nahi hai.</td></tr>';
}

function showLogin() {
  document.getElementById('dashboard').classList.add('d-none');
  document.getElementById('adminLogin').classList.remove('d-none');
}

// Page khulne par: agar pehle se admin login hai to seedha dashboard
(async function init() {
  const res = await fetch('/api/admin/customers');
  if (res.ok) showDashboard();
  else showLogin();
})();
</script>
</body>
</html>
